<script>
  (function(){
    var SERIES = [
      { id:'portraits', title:'Portraits', titleEn:'Portraits', files:['002','005','009','013'] }
    ];
    var wrap = document.getElementById('series-teasers');
    SERIES.forEach(function(s){
      var block = document.createElement('div');
      block.className = 'series-block';
      var head = document.createElement('div');
      head.className = 'section-head';
      head.innerHTML = '<h2 style="font-size:1.1rem; font-family: var(--font-body); font-weight:500;">' +
        '<span data-en="Series">Série</span> — <span data-en="' + s.titleEn + '">' + s.title + '</span></h2>' +
        '<a class="link-arrow" href="series.html" data-en="All series →">Toutes les séries →</a>';
      block.appendChild(head);
      var viewport = document.createElement('div');
      viewport.className = 'teaser-viewport';
      var strip = document.createElement('a');
      strip.className = 'teaser-row';
      strip.href = 'series.html#viewer:' + s.id;
      s.files.forEach(function(f){
        var fig = document.createElement('div');
        fig.className = 'frame';
        fig.innerHTML = '<img src="photos/teaser/teaser-' + f + '.jpg" alt="" loading="lazy">';
        strip.appendChild(fig);
      });
      viewport.appendChild(strip);
      var fade = document.createElement('div');
      fade.className = 'teaser-fade';
      viewport.appendChild(fade);
      block.appendChild(viewport);
      wrap.appendChild(block);

      // Once the first 3 photos have loaded, clip the viewport so photos
      // 1 and 2 show fully, photo 3 shows only its first half, and the
      // fade covers exactly that trailing half — hinting there's more.
      function sizeViewport(){
        var rowH = strip.clientHeight;
        var imgsIn = strip.querySelectorAll('img');
        if (imgsIn.length < 3 || !rowH) return;
        var w = [];
        for (var k = 0; k < 3; k++){
          var im = imgsIn[k];
          if (!im.naturalWidth || !im.naturalHeight) return;
          w.push(im.naturalWidth * (rowH / im.naturalHeight));
        }
        var cutoff = w[0] + w[1] + (w[2] / 2);
        viewport.style.width = Math.round(cutoff) + 'px';
        fade.style.width = Math.round(w[2] / 2) + 'px';
      }
      var imgs = strip.querySelectorAll('img');
      var remaining = Math.min(3, imgs.length);
      imgs.forEach(function(img, i){
        if (i >= 3) return;
        if (img.complete && img.naturalWidth) { remaining--; if (remaining <= 0) sizeViewport(); }
        else img.addEventListener('load', function(){ remaining--; if (remaining <= 0) sizeViewport(); });
      });
      window.addEventListener('resize', function(){
        viewport.style.width = '';
        requestAnimationFrame(sizeViewport);
      });
    });
    if (window.applyI18n) window.applyI18n(window.siteLang(), wrap);
  })();
</script>
